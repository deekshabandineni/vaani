name: ci
on: [push, pull_request]

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e "ml[train,dev]"
      - name: Check shared files are up to date
        run: python ml/scripts/build_shared.py && git diff --exit-code shared/
      - run: cd ml && pytest -q   # includes Python/JS parity and a real train->export->score run

  ml-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/ml-api/requirements.txt pytest && pip install -e ml
      - run: cd services/ml-api && pytest -q

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd services/gateway && npm ci && npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd client && npm install && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [ml, ml-api, gateway, client]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env: { JWT_SECRET: ci-only-secret-0123456789 }
