server {
    listen 80;
    root /usr/share/nginx/html;

    # Keep nginx's standard MIME types (text/html, application/javascript, ...).
    # A bare `types {}` block here would REPLACE them all and make browsers download index.html.
    include /etc/nginx/mime.types;

    location / {
        try_files $uri /index.html;
    }

    # onnxruntime-web loads its runtime as an ES module; browsers refuse modules served as octet-stream,
    # and nginx's mime.types may not list .mjs
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
    }

    # onnxruntime-web needs the right type for streaming WASM compilation
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # model files: a real 404 when missing (never fall back to index.html), and no stale caching
    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        location ~ \.onnx$ {
            default_type application/octet-stream;
            add_header Cache-Control "no-cache";
        }
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }

    # always fetch the newest service worker
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
