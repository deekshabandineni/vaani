server {
    listen 80;
    root /usr/share/nginx/html;

    # Keep nginx's standard MIME types (text/html, application/javascript, ...).
    # A bare `types {}` block here would REPLACE them all and make browsers download index.html.
    include /etc/nginx/mime.types;

    location / {
        try_files $uri /index.html;
    }

    # onnxruntime-web needs the right type for streaming WASM compilation
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    location ~ \.onnx$ {
        default_type application/octet-stream;
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }

    # always fetch the newest service worker
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
