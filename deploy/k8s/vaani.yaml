# Kubernetes deployment (tested shape for AKS; works on any cluster).
#   kubectl create namespace vaani
#   kubectl -n vaani create secret generic vaani-secrets \
#     --from-literal=JWT_SECRET=... --from-literal=AZURE_SPEECH_KEY=... \
#     --from-literal=DATABASE_URL=postgres://USER:PASS@HOST:5432/vaani
#   kubectl -n vaani apply -f deploy/k8s/vaani.yaml
# Use a managed Postgres (e.g. Azure Database for PostgreSQL) for DATABASE_URL.
# Images: push the three Dockerfiles to your registry (ACR) and replace REGISTRY below.
apiVersion: v1
kind: ConfigMap
metadata: { name: vaani-config }
data:
  AZURE_SPEECH_REGION: eastus
  FUSION_AZURE_WEIGHT: "0.6"
  ML_API_URL: http://ml-api:8000
---
# Models are copied into this volume by the init container from a model image or blob storage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: vaani-models }
spec:
  accessModes: [ReadOnlyMany]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ml-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: ml-api } }
  template:
    metadata: { labels: { app: ml-api } }
    spec:
      containers:
        - name: ml-api
          image: REGISTRY/vaani-ml-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: vaani-config } }]
          env:
            - name: AZURE_SPEECH_KEY
              valueFrom: { secretKeyRef: { name: vaani-secrets, key: AZURE_SPEECH_KEY, optional: true } }
          volumeMounts: [{ name: models, mountPath: /models, readOnly: true }]
          resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
      volumes: [{ name: models, persistentVolumeClaim: { claimName: vaani-models, readOnly: true } }]
---
apiVersion: v1
kind: Service
metadata: { name: ml-api }
spec: { selector: { app: ml-api }, ports: [{ port: 8000, targetPort: 8000 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ml-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ml-api }
  minReplicas: 2
  maxReplicas: 8
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: REGISTRY/vaani-gateway:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: vaani-config } }]
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: vaani-secrets, key: JWT_SECRET } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: vaani-secrets, key: DATABASE_URL } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec: { selector: { app: gateway }, ports: [{ port: 3000, targetPort: 3000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: client }
spec:
  replicas: 2
  selector: { matchLabels: { app: client } }
  template:
    metadata: { labels: { app: client } }
    spec:
      containers:
        - name: client
          image: REGISTRY/vaani-client:latest
          ports: [{ containerPort: 80 }]
          volumeMounts: [{ name: models, mountPath: /usr/share/nginx/html/models, readOnly: true }]
      volumes: [{ name: models, persistentVolumeClaim: { claimName: vaani-models, readOnly: true } }]
---
apiVersion: v1
kind: Service
metadata: { name: client }
spec: { selector: { app: client }, ports: [{ port: 80, targetPort: 80 }] }
---
# WebSockets: with several gateway replicas, a user's devices may land on different pods.
# Sticky sessions keep it simple for now; Redis pub/sub in Hub is the scalable next step.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaani
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: vaani.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: gateway, port: { number: 3000 } } } }
          - { path: /ws, pathType: Prefix, backend: { service: { name: gateway, port: { number: 3000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: client, port: { number: 80 } } } }
