[project]
name = "vaani-ml"
version = "0.1.0"
description = "Phoneme recognition, GOP scoring and edge export for the Vaani pronunciation coach"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "onnxruntime>=1.17", "cmudict>=1.0", "soundfile>=0.12"]

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15", "onnxscript"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vaani_ml*"]

[tool.pytest.ini_options]
markers = ["slow: trains a small model (1-2 min on CPU)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
